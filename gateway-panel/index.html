<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CentralPay — Painel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toasts"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">C</div>
        <div><b>CentralPay</b><span>Gateway Panel</span></div>
      </div>
      <div class="nav-group">Gateways</div>
      <a class="nav-item active" data-route="inicio"><span class="ic">◆</span> Início</a>
      <a class="nav-item" data-route="estatisticas"><span class="ic">▚</span> Estatísticas</a>
      <a class="nav-item" data-route="carteira"><span class="ic">◈</span> Carteira</a>
      <a class="nav-item" data-route="gerar"><span class="ic">＋</span> Gerar pagamento</a>
      <a class="nav-item" data-route="api"><span class="ic">⌘</span> API &amp; Docs</a>
      <div class="nav-group">LofyCentral</div>
      <a class="nav-item" data-route="lofys"><span class="ic">◱</span> Central Lofy</a>
      <a class="nav-item" data-route="cobrancas"><span class="ic">☰</span> Cobranças Lofy</a>
      <div class="spacer"></div>
      <div class="lock">
        <label>🔒 Chave de acesso</label>
        <input id="apiKeyInput" type="password" placeholder="CENTRALPAY_API_KEY" autocomplete="off">
        <div class="st muted" id="apiKeySt">necessária para operações reais</div>
      </div>
      <button class="btn ghost" onclick="logout()" style="width:100%;margin-top:10px;padding:9px">⎋ Sair</button>
      <div class="foot">v2 • painel real</div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <button class="btn ghost mobile-only" id="menuBtn" style="padding:8px 12px;margin-bottom:8px">☰</button>
          <h1 id="pageTitle">Início</h1>
          <div class="sub" id="pageSub">Visão geral da sua operação</div>
        </div>
        <div class="pill"><span class="dotlive"></span> Operacional</div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <script src="gateways.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
